[project]
name = "legal-rag-deployment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.6,<2",
    "ddgs>=9.16.1",
    "langchain-community>=0.3,<1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=0.3,<2",
    "langchain-text-splitters>=0.3,<2",
    "numpy>=1.26,<3",
    "pymupdf>=1.25,<2",
    "python-dotenv>=1,<2",
    "sentence-transformers>=3,<6",
    "streamlit>=1.45,<2",
]

[project.scripts]
legal-rag-deployment = "legal_rag_deployment:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
